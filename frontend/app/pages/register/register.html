<form class="registration-card" method="post" action="javascript:void(0)">

    <div class="registration-card-header">
        <h1>Task manager</h1>

        <h3>Registration</h3>
    </div>

    <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********" required>
    </div>

    <div class="password-requirements" id="password-requirements">
        <p id="requirement-length" class="invalid">❌Minimum 8 characters</p>
        <p id="requirement-special" class="invalid">❌At least one special character</p>
        <p id="requirement-number" class="invalid">❌At least one number</p>
    </div>

    <div class="input-group">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="********" required>
    </div>

    <button class="btn-submit" type="submit">
        Submit
    </button>

    <div class="btn-nav">
        <p class="back-link" id="go-back" onclick="navigateTo('landing')">
            <span class="arrow">←</span> Back to home
        </p>
    </div>
</form>
